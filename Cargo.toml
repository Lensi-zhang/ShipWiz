[package]
name = "shipwiz"
version = "0.2.5"
description = "Lightweight nautical Docker desktop client"
edition = "2021"
rust-version = "1.77.2"
default-run = "shipwiz"
build = "src-backend/build.rs"

[features]
default = ["desktop"]
desktop = [
    "dep:tauri",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-process",
    "dep:tauri-plugin-updater",
]

[lib]
name = "shipwiz_lib"
path = "src-backend/src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
bollard = { version = "0.19", features = ["ssl"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
url = "2"
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "crypto-rust", "linux-native-sync-persistent", "windows-native"] }
ssh2 = "0.9"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }

[target.'cfg(windows)'.dependencies]
named_pipe = "0.4"
ssh2 = { version = "0.9", features = ["vendored-openssl"] }

[[bin]]
name = "shipwiz"
path = "src-backend/src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "shipwiz-cli"
path = "src-backend/src/cli_main.rs"
