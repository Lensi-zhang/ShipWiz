name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Verify release version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check synchronized manifest versions
        run: node scripts/version.mjs check
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(node --input-type=module -e "import { readFileSync } from 'node:fs'; console.log(JSON.parse(readFileSync('package.json', 'utf8')).version)")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}."
            exit 1
          fi

  cli:
    name: CLI (${{ matrix.asset }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: shipwiz-cli
            asset: shipwiz-cli-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: shipwiz-cli.exe
            asset: shipwiz-cli-windows-x64.exe
          - os: macos-15
            target: aarch64-apple-darwin
            binary: shipwiz-cli
            asset: shipwiz-cli-darwin-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: shipwiz-cli
            asset: shipwiz-cli-darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libssl-dev
      - name: Build CLI
        run: cargo build --release --no-default-features --bin shipwiz-cli --target ${{ matrix.target }}
      - name: Stage asset
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}" || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
          draft: true

  linux-desktop:
    name: Linux desktop (deb/AppImage)
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libdbus-1-dev \
            libgtk-3-dev
      - run: npm ci
      - name: Verify updater signing secret
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is required for signed desktop releases."
            exit 1
          fi
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ShipWiz __VERSION__
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: shipwiz-linux-desktop
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

  windows-desktop:
    name: Windows desktop (MSI/NSIS)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      - name: Verify updater signing secret
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is required for signed desktop releases."
            exit 1
          fi
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ShipWiz __VERSION__
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles msi,nsis
      - uses: actions/upload-artifact@v4
        with:
          name: shipwiz-windows-desktop
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

  macos-desktop:
    name: macOS desktop (${{ matrix.arch }} DMG)
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      - name: Verify updater signing secret
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is required for signed desktop releases."
            exit 1
          fi
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ShipWiz __VERSION__
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: --bundles app,dmg
      - uses: actions/upload-artifact@v4
        with:
          name: shipwiz-macos-desktop-${{ matrix.arch }}
          path: target/release/bundle/dmg/*.dmg

  normalize-updater:
    name: Normalize and publish updater manifest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [cli, linux-desktop, windows-desktop, macos-desktop]
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download draft release and updater manifest
        run: |
          mkdir -p updater/original updater/normalized updater/verified
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > updater/release.json
          gh release download "${RELEASE_TAG}" --pattern latest.json --dir updater/original
      - name: Normalize updater asset URLs
        run: node scripts/normalize-updater.mjs updater/original/latest.json updater/release.json updater/normalized/latest.json "${RELEASE_TAG#v}"
      - name: Upload normalized updater manifest
        run: gh release upload "${RELEASE_TAG}" updater/normalized/latest.json --clobber
      - name: Verify uploaded updater manifest
        run: |
          gh release download "${RELEASE_TAG}" --pattern latest.json --dir updater/verified --clobber
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";

          const original = JSON.parse(readFileSync("updater/original/latest.json", "utf8"));
          const normalized = JSON.parse(readFileSync("updater/normalized/latest.json", "utf8"));
          const actual = JSON.parse(readFileSync("updater/verified/latest.json", "utf8"));
          assert.deepEqual(actual, normalized);
          for (const [platform, entry] of Object.entries(actual.platforms)) {
            assert.ok(
              entry.url.startsWith(
                `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${process.env.RELEASE_TAG}/`,
              ),
              `${platform} does not use a public release URL`,
            );
            assert.equal(entry.signature, original.platforms[platform].signature);
          }
          NODE
      - name: Publish verified release
        run: gh release edit "${RELEASE_TAG}" --draft=false --latest
